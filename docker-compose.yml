services:
  saham-bot:
    build:
      context: .
      args:
        SKIP_MODEL: "${SKIP_MODEL:-0}"   # SKIP_MODEL=1 docker compose build → slim, tanpa ML
    container_name: saham-bot
    env_file: .env
    environment:
      STORE_DB: /app/data/store.db
      STORE_FILE: /app/data/store.json   # hanya dipakai sekali untuk migrasi JSON lama
      TMP_DIR: /app/data/temp
      SAHAMBOT_CACHE: /app/data/cache
      HEARTBEAT_FILE: /app/data/heartbeat.txt
      SAHAMBOT_LOCAL_MODEL: /app/models/indo-fin-roberta
    volumes:
      - ./data:/app/data         # watchlist/alert/paper-trading (SQLite) bertahan lintas rebuild
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
