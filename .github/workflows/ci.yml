name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
          - python-version: "3.13"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Dependency check
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Test + coverage
        run: >
          pytest --cov=core --cov=handlers --cov=bot --cov=config
          --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Compose syntax check
        run: |
          cp .env.example .env
          docker compose config -q
          rm -f .env
      - name: Docker build (SKIP_MODEL=1) + import smoke test
        run: |
          docker build --build-arg SKIP_MODEL=1 -t saham-bot:ci-smoke .
          docker run --rm --entrypoint python saham-bot:ci-smoke -c "import bot, config, core, handlers; print('docker-import-ok')"
